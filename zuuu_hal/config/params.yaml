zuuu_hal:
  ros__parameters:
    laser_upper_angle: 2.12 # value tuned for a Reachy2 with a tripod
    laser_lower_angle: -2.12 # is often -laser_upper_angle
    max_duty_cycle: 0.50 # max is 1.0
    cmd_vel_timeout: 0.2
    max_full_com_fails: 100
    main_tick_period: 0.02
    control_mode: "OPEN_LOOP"
    max_accel_xy: 1.0
    max_accel_theta: 1.0
    max_speed_xy: 0.61
    max_speed_theta: 2.0
    smoothing_factor: 0.0
    safety_distance: 0.70 # distance from the center of the robot
    critical_distance: 0.55 # distance from the center of the robot
    safety_on: true

    # Goto (GOTO mode, e.g. reachy.mobile_base.goto()). Live: ros2 param set /zuuu_hal goto_strategy legacy
    goto_strategy: "staged" # "staged": rotate to face the goal, drive straight, rotate. "legacy": goto_tick
    goto_align_tolerance: 0.15 # rad, start driving when facing the goal within this
    goto_aim_distance: 0.15 # m, aim at the goal while farther than this (shorter moves don't turn to face it)
    goto_turn_distance: 0.03 # m, rotate to the final orientation when closer than this
    # Once arrived (within the goto tolerances), full PID for a few seconds, then back to the P-only gains.
    # An integral term removes the error left by friction, but kept on for long, the rollers' steps cause small
    # endless corrections. Theta gains: the no-overshoot Ziegler-Nichols tuning from 15/10/2024; x/y: same ratios.
    goto_precision_duration: 3.0 # s, 0 disables it
    goto_precision_dist_tol: 0.002 # m, back to P-only earlier once this close
    goto_precision_angle_tol: 0.0035 # rad (0.2 deg)
    goto_precision_p_xy: 5.0
    goto_precision_i_xy: 22.0
    goto_precision_d_xy: 0.74
    goto_precision_p_theta: 3.2
    goto_precision_i_theta: 14.2
    goto_precision_d_theta: 0.475
